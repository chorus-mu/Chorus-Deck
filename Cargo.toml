[workspace]
resolver = "2"
members = [
    "crates/core-shared",
    "crates/desktop",
    "crates/backend-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Chorus Deck Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
core-shared = { path = "crates/core-shared" }
desktop = { path = "crates/desktop" }

# Common async, serialization & synchronization primitives
tokio = { version = "1.43", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
bytes = "1"
log = "0.4"
env_logger = "0.11"

# Lossless & Opus audio decoding pipeline
rodio = { version = "0.20", default-features = false, features = ["symphonia-all", "flac", "mp3", "vorbis", "wav"] }
symphonia = { version = "0.5", features = ["all"] }

# Tauri 2
tauri = { version = "2.0", features = ["tray-icon", "image-png"] }
tauri-build = { version = "2.0", features = [] }

# GPUI engine (Official Zed upstream repository)
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui" }
gpui_windows = { git = "https://github.com/zed-industries/zed", package = "gpui_windows" }

[workspace.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
]
