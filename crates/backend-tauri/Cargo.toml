[package]
name = "chorus-deck"
version = "5.1.0"
description = "Chorus Deck"
authors = ["Chorus Deck"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "chorus_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
tempfile = "3"

tokio = { version = "1", features = ["fs", "io-util", "rt", "rt-multi-thread", "macros", "sync", "time"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
base64 = "0.22"
lofty = "0.25"
souvlaki = "0.8.3"
lazy_static = "1.5.0"
raw-window-handle = "0.6.2"
ytmusicapi = "0.5.0"
unm_engine = "0.4.0"
unm_types = "0.4.0"
unm_request = "0.4.0"
unm_selector = "0.4.0"
rodio = { version = "0.19.0", features = ["symphonia-aac", "symphonia-isomp4", "symphonia-flac"] }
symphonia = { version = "0.5", features = ["aac", "isomp4", "flac", "alac", "pcm", "mkv", "ogg", "vorbis", "wav", "aiff"] }
core-shared = { path = "../core-shared" }
desktop = { path = "../desktop" }
biquad = "0.6.0"
hmac = "0.12.1"
data-encoding = "2.11.1"
urlencoding = "2.1.3"
strsim = "0.11"
regex = "1"
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-native-roots"] }
tungstenite = { version = "0.29.0", features = ["rustls-tls-native-roots"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Registry",
  "Win32_Graphics_Dwm",
] }

[features]
default = []
